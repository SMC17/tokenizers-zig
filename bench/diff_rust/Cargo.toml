[package]
name = "tokenizers-diff-rust"
version = "0.0.1"
edition = "2021"
publish = false

[[bin]]
name = "diff_dump"
path = "src/main.rs"

[dependencies]
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
